<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三练一休</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#f5f5f5;
  color:#222;
}
.app{
  max-width:520px;
  margin:auto;
  padding:24px 18px 40px;
}
h1{margin:0;font-size:30px}
.sub{color:#777;margin-top:6px}
.card{
  background:white;
  border-radius:20px;
  padding:24px;
  margin-top:20px;
  box-shadow:0 4px 18px #00000010;
}
.status{
  font-size:38px;
  font-weight:bold;
  margin:10px 0;
}
.desc{color:#777}
button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:20px;
  font-size:17px;
  font-weight:bold;
  background:#222;
  color:white;
}
button:disabled{background:#aaa}
.days{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:18px;
}
.day{
  background:white;
  border-radius:14px;
  padding:14px 5px;
  text-align:center;
  border:2px solid transparent;
}
.day.today{
  border-color:#222;
}
.day small{color:#888}
.stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.reset{
  width:auto;
  margin:0;
  padding:10px 14px;
  font-size:14px;
  background:#eee;
  color:#333;
}
</style>
</head>

<body>
<div class="app">

<h1>三练一休</h1>
<div class="sub">练3天 · 休1天 · 循环进行</div>

<div class="card">
  <div id="status" class="status">训练日</div>
  <div id="desc" class="desc">今天完成训练后打卡</div>
  <button id="check">完成今天训练 ✓</button>
</div>

<div class="days" id="days"></div>

<div class="card stats">
  <div>
    <div class="sub">已完成训练</div>
    <strong id="count" style="font-size:28px">0</strong>
    <span> 天</span>
  </div>
  <button class="reset" id="reset">重新开始</button>
</div>

</div>

<script>
let day = Number(localStorage.getItem("trainingDay") || 0);
let count = Number(localStorage.getItem("trainingCount") || 0);

const status = document.getElementById("status");
const desc = document.getElementById("desc");
const check = document.getElementById("check");
const days = document.getElementById("days");
const countText = document.getElementById("count");
const reset = document.getElementById("reset");

function save(){
  localStorage.setItem("trainingDay", day);
  localStorage.setItem("trainingCount", count);
}

function render(){
  const current = day % 4;
  const rest = current === 3;

  if(rest){
    status.textContent = "休息日";
    desc.textContent = "今天恢复一下，明天继续训练";
    check.textContent = "今天是休息日";
    check.disabled = true;
  }else{
    status.textContent = "训练日";
    desc.textContent = "完成训练后点击打卡";
    check.textContent = "完成今天训练 ✓";
    check.disabled = false;
  }

  countText.textContent = count;

  days.innerHTML = "";

  const names = ["训练","训练","训练","休息"];

  for(let i=0;i<8;i++){
    const n = (current+i)%4;
    const div = document.createElement("div");

    div.className = "day" + (i===0 ? " today" : "");

    div.innerHTML =
      "<small>"+(i===0 ? "今天" : "之后")+"</small>" +
      "<br><strong>"+names[n]+"</strong>" +
      "<br><small>第"+(n+1)+"天</small>";

    days.appendChild(div);
  }

  save();
}

check.onclick = function(){
  if(day % 4 !== 3){
    count++;
    day++;
    render();
  }
};


reset.onclick = function(){
  day = 0;
  count = 0;
  render();
};

render();
</script>
</body>
</html>
